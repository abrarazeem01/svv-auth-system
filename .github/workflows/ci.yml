name: SVV Validation Pipeline

on:
  push:
    branches:
      - main

jobs:

  validate-project:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Folder Structure
        run: |
          test -d requirements
          test -d z-model
          test -d vdm
          test -d Alloy
          test -d Validation

      - name: Verify Required Files
        run: |
          test -f requirements/SRS.md
          test -f z-model/auth-system.zed
          test -f vdm/auth-system.vdmpp
          test -f Alloy/auth-system.als
          test -f README.md

      - name: Generate Validation Report
        run: |
          echo "SVV Validation Successful"

      - name: Pipeline Success
        run: echo "Pipeline Passed"
