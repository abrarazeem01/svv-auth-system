name: SVV Validation Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate-project:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Folder Structure
        run: |
          test -d requirements
          test -d z-model
          test -d vdm
          test -d Alloy
          test -d Validation

      - name: Verify Requirement Files
        run: |
          test -f requirements/SRS.md
          test -f requirements/defect-taxonomy.md
          test -f requirements/github-issues.md

      - name: Verify Z Model
        run: |
          test -f z-model/systemauth.zed

      - name: Verify VDM Model
        run: |
          test -f vdm/systemauth.vdmpp

      - name: Verify Alloy Model
        run: |
          test -f Alloy/Systemauth.als

      - name: Verify Validation Files
        run: |
          test -f "Validation/RequirRequirement Validation CheckList"
          test -f Validation/final-system-validation.md
          test -f Validation/owasp-zap-report.md

      - name: Verify README
        run: |
          test -f README.md

      - name: Generate Validation Report
        run: |
          echo "SVV Validation Successful"

      - name: Pipeline Success
        run: |
          echo "Pipeline Passed"
